.dockwrap{display:grid;gap:8px;justify-items:end;font-size:11px}
.dock{display:flex;align-items:flex-end;justify-content:center;gap:6px;height:48px;width:250px;max-width:100%}
.sw{flex:none;width:20px;height:20px;border-radius:50%;border:0;padding:0;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(128,128,128,.35);transition:width .12s,height .12s,box-shadow .2s}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--fg)}
@media (max-width:700px){.mid{align-items:flex-end}.orb{top:44%;width:min(70vw,52vh)}.foot{flex-direction:column;align-items:stretch}.dockwrap{justify-items:start}}
@media (prefers-reduced-motion:reduce){.sw{transition:none}}

:root{--bg:#f4f5f7;--fg:#0b0c10;--mute:#8a8e99;--ac:#BA1650;--glass:rgba(255,255,255,.72)}
html,body{overflow:hidden;background:var(--bg)}
body{background:radial-gradient(circle at 50% 45%,#fff 0,#f4f5f7 55%,#e9ebf0 100%);padding:0}
#floor{position:fixed;inset:0;z-index:0;cursor:grab;touch-action:none;overflow:hidden;background-image:radial-gradient(rgba(10,12,20,.13) 1px,transparent 1.2px);background-size:36px 36px}
#floor.drag{cursor:grabbing}
#world{position:absolute;left:50%;top:50%;width:0;height:0;will-change:transform}
.it{position:absolute;transform:translate(-50%,-50%) rotate(var(--r));cursor:pointer;transition:transform .35s cubic-bezier(.2,.8,.2,1),filter .35s;-webkit-user-drag:none}
.it img{display:block;width:100%;height:100%;pointer-events:none;user-select:none;-webkit-user-drag:none}
.it:hover{transform:translate(-50%,-50%) rotate(var(--r)) scale(1.07) translateY(-6px);filter:drop-shadow(0 22px 22px rgba(10,12,30,.18));z-index:5}
.it .tg{position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);white-space:nowrap;font-size:10px;opacity:0;transition:opacity .2s;pointer-events:none}
.it:hover .tg{opacity:1}
.orb{z-index:3;max-width:none}
.orb:not(.nogl):after{content:"";position:absolute;left:18%;right:18%;bottom:-6%;height:10%;background:radial-gradient(ellipse,rgba(10,12,30,.22),transparent 70%);z-index:-1;filter:blur(6px)}
.ui{position:fixed;z-index:10;pointer-events:none}.ui a,.ui button,.ui div{pointer-events:auto}
.nav{top:18px;left:20px;display:grid;gap:4px;font-size:15px}
.nav button{all:unset;cursor:pointer;display:block}.nav button:hover,.nav button.on{color:var(--ac)}
.nav .brand{font-size:11px;color:var(--mute);margin-bottom:8px}
.meta{position:fixed!important;top:18px;right:20px;margin:0}
.foot{position:fixed;left:20px;right:20px;bottom:16px;z-index:10;pointer-events:none}.foot a,.foot .dockwrap,.foot .mark{pointer-events:auto}
.hint{left:50%;bottom:92px;transform:translateX(-50%);color:var(--mute);font-size:10px;letter-spacing:.14em}
.panel{position:fixed;top:12px;right:12px;bottom:12px;width:min(380px,calc(100vw - 24px));z-index:20;background:var(--glass);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid rgba(10,12,30,.08);border-radius:18px;padding:18px;overflow:auto;transform:translateX(110%);transition:transform .45s cubic-bezier(.2,.8,.2,1);box-shadow:0 30px 60px -20px rgba(10,12,30,.25)}
.panel.open{transform:none}
.panel .x{all:unset;cursor:pointer;float:right;font-size:11px;color:var(--mute)}.panel .x:hover{color:var(--ac)}
.panel h2{font-size:30px;line-height:.95;margin:14px 0 4px;font-weight:600}
.panel .pic{height:250px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:12px;margin-top:10px}.panel .pic img{max-width:88%;max-height:88%}
.panel dl{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:16px 0;font-size:12px}.panel dt{color:var(--mute)}.panel dd{margin:0;text-align:right}
.panel p{font-size:13px;line-height:1.3;text-transform:none;letter-spacing:0}
.price{font-size:26px;color:var(--ac)}
.cta{display:inline-block;margin-top:10px;padding:9px 16px;border-radius:99px;background:var(--fg);color:#fff;font-size:12px}.cta:hover{background:var(--ac)}
.list button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:10px;width:100%;padding:7px 0;border-bottom:1px solid rgba(10,12,30,.07);font-size:12px}.list button:hover{color:var(--ac)}
@media(max-width:700px){.meta{display:none}.hint{bottom:150px}.nav{font-size:14px}}

@font-face{font-family:RDisp;src:url(fonts/RadoyaDisplay-SemiBold.woff2);font-weight:600}
@font-face{font-family:RDisp;src:url(fonts/RadoyaDisplay-Italic.woff2);font-style:italic}
@font-face{font-family:RSans;src:url(fonts/RadoyaSans-Regular.woff2);font-weight:400}
@font-face{font-family:RSans;src:url(fonts/RadoyaSans-Medium.woff2);font-weight:500}
:root{--fg:#2a2a2e;--ink:#424242;--pink:#FF98BB;--tint:#FFE3EC;--brand:#BA1650;--display:RSans,'Barlow Condensed',Arial,sans-serif}
body{font-family:RSans,Arial,sans-serif;font-weight:500;color:var(--fg)}::selection{background:var(--pink);color:var(--ink)}
.nav,.nav button,.meta,.meta a,.foot,.foot *{color:var(--fg)}.meta .sep,.nav .brand{color:var(--mute)}
.nav button{font-size:14px;letter-spacing:.05em}.nav button:hover,.nav button.on{color:var(--brand)!important}
.nav .brand{display:block;margin-bottom:12px}.nav .brand svg{width:104px;height:auto;display:block;color:var(--brand)}.nav .brand svg *{fill:currentColor!important}.nav .brand small{display:block;margin-top:5px;font-size:9px;letter-spacing:.14em;color:var(--mute)}
.panel h2,.price{font-family:RDisp,Georgia,serif;font-weight:600;text-transform:none}.price{font-size:34px;color:var(--brand)}
.cta{background:var(--brand)}.cta:hover{background:var(--ink)}
#ld{position:fixed;inset:0;z-index:999;background:#fff;display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;transition:opacity .7s .1s,visibility 0s .8s;color:var(--brand)}
#ld svg{width:170px;height:auto}#ld svg *{fill:currentColor!important}#ld p{margin:0;font:italic 500 20px RDisp,Georgia,serif;text-transform:none;color:var(--ink);letter-spacing:0}
#ld.off{opacity:0;visibility:hidden}
#cur{position:fixed;left:0;top:0;z-index:998;pointer-events:none;padding:6px 12px;border-radius:99px;background:var(--brand);color:#fff;font-size:10px;letter-spacing:.12em;opacity:0;transform:translate(-50%,-50%);transition:opacity .2s,background .2s,padding .2s}
#cur.on{opacity:1}#cur.sm{padding:4px 9px;background:var(--ink)}
@media (pointer:fine){#floor,.it{cursor:none}}
.pv{position:fixed;inset:0;z-index:30;background:linear-gradient(180deg,#fbf6f8,var(--tint));visibility:hidden;opacity:0;transition:opacity .45s,visibility 0s .45s;overflow:hidden}
.pv.open{visibility:visible;opacity:1;transition:opacity .45s}
.pv-ghost{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 3vw;text-transform:none;font-family:RDisp,Georgia,serif;font-weight:600;line-height:.9;transition:transform .25s ease-out;pointer-events:none}
